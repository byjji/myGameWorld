# Game-Party 정적 배포 (Netlify)
#
# 빌드 단계 없음. 바닐라 JS를 그대로 올린다 (PROJECT.md 2장).
# 루트(/)에서 TV 화면이 열려야 한다 — TV 리모컨으로 주소를 치는 일을
# 최대한 줄이기 위함 (PROJECT.md 12장).

# 저장소 루트를 그대로 올리면 dev/·test/·server/·설계 문서까지 공개된다.
# netlify-build.sh가 배포에 필요한 것만 dist/로 복사한다. 트랜스파일은 없다.
[build]
  publish = "dist"
  command = "sh netlify-build.sh"

# 루트 = TV 화면. 리다이렉트가 아니라 rewrite(200)다.
# 주소창에 남는 글자가 짧을수록 리모컨 입력이 짧아진다.
[[redirects]]
  from = "/"
  to = "/tv/index.html"
  status = 200

# 폰은 /p 하나만 치면 되게 한다. /play/index.html은 리모컨 없이 폰으로 치는 주소지만
# 그래도 짧을수록 좋다.
[[redirects]]
  from = "/p"
  to = "/play/index.html"
  status = 200

# 진단 페이지도 리모컨으로 쳐야 한다. 조카 집에서 여는 주소라 짧게.
[[redirects]]
  from = "/echo"
  to = "/tools/echo_1.html"
  status = 200

[[redirects]]
  from = "/bench"
  to = "/tools/tv-bench_1.html"
  status = 200

# 레이싱 도로 렌더러 단독 측정 (phase8). 게임 없이 라인 수·스프라이트 상한을 잡는다.
[[redirects]]
  from = "/road"
  to = "/tools/road-bench_1.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # 폰의 방향 센서는 보안 컨텍스트에서만 동작한다. HTTPS는 Netlify가 붙여준다.
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"

# 게임 코드는 자주 고친다. 캐시가 남아 있으면 조카 집 TV에서 옛날 판이 돈다.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/tv/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/play/*"
  [headers.values]
    Cache-Control = "no-cache"

# 그림은 반대다. 한 번 받으면 오래 들고 있어야 한다 —
# TV가 매번 배경을 다시 받으면 우리 집 업로드 대역이 아니라 조카 집 회선이 고생한다.
# 그림을 고치면 파일 이름에 숫자를 붙인다 (PROJECT.md 11장).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
