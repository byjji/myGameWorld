# L-Party 릴레이 — Synology NAS Docker
#
#   docker compose up -d --build
#
# 정적 파일은 Netlify가 서빙한다 (PROJECT.md 1장). 여기는 WebSocket만 돈다.
# 컨테이너 앞에는 Synology 리버스 프록시가 서고, 인증서도 거기서 끝난다.

services:
  relay:
    build: ./server
    image: lparty-relay:latest
    container_name: lparty-relay

    # NAS 재부팅 후 자동 기동. `always`가 아니라 `unless-stopped`인 이유는
    # 사람이 일부러 멈춰둔 컨테이너를 재부팅이 되살리지 않게 하기 위함.
    restart: unless-stopped

    # 127.0.0.1에만 연다. 외부 노출은 리버스 프록시(443)를 통해서만 이뤄진다.
    # 0.0.0.0으로 열면 인증서 없는 평문 ws가 공유기 포트포워딩 실수 한 번에 열린다.
    ports:
      - "127.0.0.1:8000:8000"

    environment:
      - LP_PORT=8000
      # LP_STATIC은 비워둔다. 정적 파일을 NAS에서 내보내지 않는다.

    # 방 상태는 메모리 딕셔너리뿐이다. 볼륨이 필요 없다 (PROJECT.md 2장).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
