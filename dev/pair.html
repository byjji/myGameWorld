<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>L-Party 개발 페어</title>
<!--
  개발용. TV와 폰을 한 탭 안에 나란히 띄운다.

  왜 필요한가: 브라우저는 백그라운드 탭의 requestAnimationFrame과 타이머를 늦춘다.
  두 탭으로 열면 보고 있지 않은 쪽이 멈춰서 흐름을 확인할 수 없다.
  같은 탭 안의 iframe 두 개는 둘 다 전경이라 정상 속도로 돈다.

  폰 쪽 키보드 조작 (js/devsensor.js):
    J = 점프   P = 쳐올리기   S = 스쿼트   ← → = 좌우 기울이기
  누르기 전에 오른쪽 폰 화면을 한 번 클릭해 포커스를 준다.
-->
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden;
               font-family: -apple-system, "Malgun Gothic", sans-serif; }
  #wrap { display:flex; height:100%; }
  #tv { flex:1; border:0; }
  #phone { width:380px; border:0; border-left:4px solid #2a3448; }
  #bar { position:absolute; left:8px; bottom:8px; color:#8ea2c0; font:13px monospace;
         background:rgba(0,0,0,.6); padding:6px 10px; border-radius:6px; }
</style>
</head>
<body>
<div id="wrap">
  <iframe id="tv" src="../tv/index.html?dev=1&fps=1"></iframe>
  <iframe id="phone" src="../play/index.html?dev=1&debug=1"></iframe>
</div>
<div id="bar">폰 화면 클릭 후 &nbsp; J=점프 &nbsp; P=쳐올리기 &nbsp; S=스쿼트 &nbsp; ←→=기울이기</div>
</body>
</html>
